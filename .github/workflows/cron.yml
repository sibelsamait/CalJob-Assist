name: Daily Cron

on:
  schedule:
    - cron: '0 2 * * *' # run daily at 02:00 UTC
  workflow_dispatch: {}

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call subscriptions cron endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL secret not set"; exit 1; fi
          curl -X POST "$SITE_URL/api/payments/cron/subscriptions"
